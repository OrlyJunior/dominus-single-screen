; Dominus Single Screen - settings. Read once when the game starts.
; Supported: Castlevania Dominus Collection (Steam), game.exe SHA-256
; E6FA885F560C8A47640FF8DF4DE3CE4A938C8053EB11A90A7B65F5EBF1AB6B64.
; Any other game build: the DLL only forwards Direct3D 11 and changes nothing.
[runtime]
EnableObserver=1
EnableNativeObserver=1
EnableNativePause=1
EnablePortraitTestControls=1
EnableMarkerBlink=1
; 1 = single-screen view already on when a game starts (View+Y toggles it).
StartEnabled=0
; Experimental Dawn of Sorrow support: 1 enables it (single screen, enlarged
; map, merchants' and pause menus, touch remapping); 0 keeps Dawn untouched.
; Change it here, before Install.bat: an installed INI must not be edited.
EnableExperimentalDawn=0
; Diagnostic-only options (keep 0 / commented out for normal use):
EnableMarkerTrace=0
; Diagnostic logs. Default: %LOCALAPPDATA%\DominusSingleScreen (safe to delete).
